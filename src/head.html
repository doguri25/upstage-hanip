<title>업스테이지한입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
/*FONTS*/
:root{
  --bg:#F5F5F7; --paper:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --line:#E3E3E8; --soft:#AEAEB2;
  --accent:#17775A; --accent-ink:#FFFFFF; --accent-bg:#E6F2EC;
  --lv1:#17775A; --lv1-bg:#DDEFE5; --lv1-ink:#0F5C45; --lv2:#2B78BD; --lv2-bg:#E6F0FB; --lv2-ink:#1C5B92;
  --hi:#FFD84D; --hi-bg:#FFF5CC; --warm:#D0782A; --pink:#F39AB0; --sky:#5AA9E6;
  --good:#1E8449; --good-bg:#E7F5EC; --bad:#D0453A; --bad-bg:#FCEBE8;
  --code-bg:#F4F4F1; --code-ink:#1D1D1F; --s:#A3521B; --k:#17775A; --n:#6A4BB5; --t:#2458B3;
  --rule:rgba(29,29,31,.05);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.07);
  --ring:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.2,.9,.25,1);
  --zoom:1;
  --hand:"Gaegu","Noto Sans KR",system-ui,sans-serif;
  --body:"NanumSquareRound",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"Nanum Gothic Coding",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#161618; --paper:#242427; --ink:#F2F2F7; --ink2:#A1A1A6; --line:#3A3A3E; --soft:#636366;
    --accent:#4CC39A; --accent-ink:#0D1B15; --accent-bg:#1B3329;
    --lv1:#4CC39A; --lv1-bg:#183A2C; --lv1-ink:#86E0BE; --lv2:#6DB7F0; --lv2-bg:#162C43; --lv2-ink:#A6D3F7;
    --hi:#E9C443; --hi-bg:#3A3217; --warm:#EE9F58; --pink:#E58BA2; --sky:#6DB7F0;
    --good:#5ACB88; --good-bg:#17301F; --bad:#F07C70; --bad-bg:#3B1F1C;
    --code-bg:#1B1B1E; --code-ink:#E6E6EB; --s:#F0A56B; --k:#5DD3A8; --n:#B69CFF; --t:#7FB0FF;
    --rule:rgba(255,255,255,.04);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161618; --paper:#242427; --ink:#F2F2F7; --ink2:#A1A1A6; --line:#3A3A3E; --soft:#636366;
  --accent:#4CC39A; --accent-ink:#0D1B15; --accent-bg:#1B3329;
  --lv1:#4CC39A; --lv1-bg:#183A2C; --lv1-ink:#86E0BE; --lv2:#6DB7F0; --lv2-bg:#162C43; --lv2-ink:#A6D3F7;
  --hi:#E9C443; --hi-bg:#3A3217; --warm:#EE9F58; --pink:#E58BA2; --sky:#6DB7F0;
  --good:#5ACB88; --good-bg:#17301F; --bad:#F07C70; --bad-bg:#3B1F1C;
  --code-bg:#1B1B1E; --code-ink:#E6E6EB; --s:#F0A56B; --k:#5DD3A8; --n:#B69CFF; --t:#7FB0FF;
  --rule:rgba(255,255,255,.04);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-webkit-text-stroke:.2px currentColor}
b,strong,h1,h2,h3,th,.primary,.pill,.q-text{-webkit-text-stroke:0}
#app{zoom:var(--zoom)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;width:100%}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none;box-shadow:var(--ring)!important}
code{overflow-wrap:anywhere;font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:.08em .35em;border-radius:6px;border:1px solid var(--line)}
mark{background:var(--hi-bg);color:inherit;padding:0 .15em;border-radius:3px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0;letter-spacing:-.015em}
p,li,.q-text,.opt .ot,.fb p,.tip,.item small,.guide li,td{text-wrap:pretty}
.item b,.utab .uname,.cbtn b,.continue b,.chip{text-wrap:balance}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper);color:var(--ink2)}

/* ---------- 공통 버튼(맥 느낌: 누르면 살짝 눌리고 스프링으로 돌아옴) ---------- */
.btn{transition:transform .32s var(--spring),box-shadow .2s,background-color .2s,border-color .2s,opacity .2s,filter .2s;cursor:pointer;user-select:none}
.btn:active:not([disabled]){transform:scale(.965);transition-duration:.08s}
.primary{width:100%;height:58px;border-radius:14px;border:0;color:var(--accent-ink);font-size:19px;font-weight:700;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.18),0 6px 16px color-mix(in srgb,var(--accent) 24%,transparent)}
.primary[disabled]{background:var(--line);box-shadow:none;color:var(--ink2);cursor:default}
.primary.ready{animation:nudge .45s var(--spring)}
.primary kbd{display:none;margin-left:10px;background:transparent;color:inherit;border-color:currentColor;opacity:.7}
.ghost{height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:16px;box-shadow:var(--shadow-sm)}
.ghost.wide{width:100%;height:52px}
.ghost[disabled]{opacity:.4;cursor:default}
.navrow{display:flex;gap:10px}
.navrow .prev{flex:none;width:96px;height:58px;font-size:17px;font-weight:600;color:var(--ink2)}
.navrow .primary{flex:1}
.linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px 0}
.seg-ctl{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:10px;padding:3px;gap:2px}
.seg-ctl button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 8px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg-ctl button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* ---------- 홈 ---------- */
.side{display:grid;gap:14px}
.home{padding-block:26px 56px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);animation:zoomIn .45s var(--ease) both}
.brand{display:flex;align-items:center;gap:14px}
.brand-t{flex:1;min-width:0}
.logo{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;border-radius:18px;transition:transform .3s var(--spring);-webkit-tap-highlight-color:transparent}
.logo:active{transform:scale(.97);transition-duration:.08s}
.logo:focus-visible{box-shadow:var(--ring)}
/* 휴대폰 첫 화면: 과정 → 단원 → 레슨 폴더 트리 */
.tree{display:none;list-style:none;margin:0;padding:0;gap:10px;grid-template-columns:minmax(0,1fr)}
.tree ul{list-style:none;margin:0;padding:0}
.tc,.tu{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.tkids{display:grid;gap:8px;grid-template-columns:minmax(0,1fr);margin-left:16px;padding-left:12px;border-left:3px solid color-mix(in srgb,var(--lv1) 40%,transparent)}
.tu>.tkids{border-left-color:color-mix(in srgb,var(--lv2) 40%,transparent)}
.tkids.fresh{animation:treeIn .3s var(--ease) both}
@keyframes treeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tnode{position:relative;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto 12px;align-items:center;column-gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:10px 14px 10px 12px;box-shadow:var(--shadow-sm);color:var(--ink)}
.tnode.course{min-height:64px}
.tnode.unit{grid-template-rows:auto auto;row-gap:6px}
.tnode .folder{grid-column:1} .tnode .tlabel{grid-column:2;grid-row:1} .tnode .tmeta{grid-column:3;grid-row:1} .tnode .chev{grid-column:4}
.tnode.unit .folder,.tnode.unit .chev{grid-row:1/3}
.tnode .tlabel{min-width:0}
.tnode .tlabel small{display:block;font-size:12px;font-weight:700;color:var(--ink2);line-height:1.35}
.tnode .tlabel b{display:block;font-size:17px;line-height:1.35}
.tnode.unit .tlabel b{font-size:16px}
.tnode .tmeta{font-size:13px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tnode.now .tmeta{color:var(--warm);font-weight:700}
.tnode.done .tmeta{color:var(--good);font-weight:700}
.tnode .chev{width:9px;height:9px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .25s var(--spring);justify-self:center}
.tnode.open .chev{transform:translate(-1px,-2px) rotate(45deg)}
/* 과정 줄(위 메뉴): 초록 */
.tnode.course{background:var(--lv1-bg);border-color:color-mix(in srgb,var(--lv1) 32%,var(--line));box-shadow:inset 5px 0 0 var(--lv1),var(--shadow-sm);padding-left:16px}
.tnode.course .tlabel small{color:var(--lv1-ink)}
.tnode.course .tlabel b{font-size:18px;font-weight:800}
.tnode.course.open{background:var(--lv1);border-color:var(--lv1);color:var(--accent-ink);box-shadow:var(--shadow)}
.tnode.course.open .tlabel small,.tnode.course.open .tmeta{color:color-mix(in srgb,var(--accent-ink) 85%,transparent)}
.tnode.course.open .chev{border-color:var(--accent-ink)}
.tnode.course.open .folder{color:var(--accent-ink)}
/* 단원 줄(가운데 메뉴): 파랑 */
.tnode.unit{background:var(--lv2-bg);border-color:color-mix(in srgb,var(--lv2) 30%,var(--line));box-shadow:inset 5px 0 0 var(--lv2),var(--shadow-sm);padding-left:16px}
.tnode.unit .tlabel small{color:var(--lv2-ink)}
.tnode.unit.open{background:color-mix(in srgb,var(--lv2) 18%,var(--paper));border-color:var(--lv2);box-shadow:inset 5px 0 0 var(--lv2),var(--shadow)}
.tnode.unit.open .folder{color:var(--lv2)}
.tnode.unit .tbar i{background:var(--lv2)}
.tnode.now:not(.open){border-color:color-mix(in srgb,var(--warm) 55%,var(--line))}
.tbar{grid-column:2/4;grid-row:2;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.folder{width:30px;height:30px;color:var(--soft)}
.folder path{stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.folder .front{fill:color-mix(in srgb,currentColor 24%,var(--paper))}
.folder .back{fill:color-mix(in srgb,currentColor 12%,var(--paper))}
.tnode.done .folder{color:var(--good)} .tnode.now .folder{color:var(--warm)}
.tree .tgoals{list-style:disc;font-size:14px;line-height:1.55;margin:2px 0;padding-left:1.2em;color:var(--ink2)}
.tree .list{gap:8px}
.tree .item{grid-template-columns:36px minmax(0,1fr) auto;gap:10px;min-height:62px;padding:10px 12px}
.tree .item .no{width:36px;height:36px;font-size:15px}
.tree .item b{font-size:16.5px}
/* 휴대폰 빈칸 말풍선 */
.code.tapblanks .blank{cursor:pointer;box-shadow:0 0 0 3px color-mix(in srgb,var(--warm) 18%,transparent)}
.code.tapblanks .blank::after{content:"▾";font-size:.7em;margin-left:3px;color:var(--warm)}
.bubble{position:absolute;z-index:40;display:grid;gap:6px;padding:8px;background:var(--paper);color:var(--ink);border:1.5px solid var(--accent);border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,.2),0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent);animation:bubbleIn .24s var(--spring) both;transform-origin:var(--tail,50%) -10px;
  font-family:var(--body);font-size:calc(16px * var(--z,1));line-height:1.45;word-break:keep-all}
.bubble::before{content:"";position:absolute;top:-9px;left:calc(var(--tail,50%) - 8px);width:15px;height:15px;background:var(--paper);border-left:1.5px solid var(--accent);border-top:1.5px solid var(--accent);transform:rotate(45deg);border-radius:4px 0 0 0}
.bopt{display:grid;grid-template-columns:calc(24px * var(--z,1)) minmax(0,1fr);align-items:center;gap:8px;min-height:calc(46px * var(--z,1));padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);text-align:left;font:inherit}
.bopt .bn{color:var(--ink2);font-weight:700}
.bopt .bt{font-family:var(--mono);white-space:pre-line;overflow-wrap:anywhere}
.bopt.on{border-color:var(--accent);background:var(--accent-bg)}
@keyframes bubbleIn{from{opacity:0;transform:translateY(-6px) scale(.95)}to{opacity:1;transform:none}}
/* 앱 정보 */
.info-title{display:flex;align-items:center;gap:10px}
.info-title .fig{width:52px} .info-title .fig svg{width:52px;max-width:52px}
.info-title h3{font-family:var(--hand);font-size:30px;line-height:1.05}
.info-rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px;line-height:1.5}
.info-rows dt{color:var(--ink2);font-weight:700}
.info-rows dd{margin:0}
.info-rows a{color:var(--accent);font-weight:700}
.history{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.history>li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hv{display:flex;align-items:baseline;gap:8px}
.hv b{color:var(--accent)} .hv small{color:var(--ink2);font-size:13px}
.history ul{margin:4px 0 0;padding-left:1.1em;font-size:14.5px;line-height:1.55}
.credit{font-size:12px;color:var(--soft);margin:0}
.brand p .streak{color:var(--warm);font-weight:700}
.brand .fig{flex:none;width:80px}
.brand .fig svg{width:80px;max-width:80px}
.brand h1{font-family:var(--hand);font-size:44px;font-weight:700;letter-spacing:0}
.brand p{margin:0;color:var(--ink2);font-size:15px;line-height:1.5}
.quick{display:flex;gap:8px;align-self:flex-start;margin-top:4px}
.qbtn{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow-sm);color:var(--ink);padding:0;cursor:pointer}
.qbtn.wide{width:auto;padding:0 12px}
.qbtn[aria-pressed="false"]{color:var(--soft)}
.qbtn .ga{font-weight:800;font-size:18px;line-height:1}
.qbtn .caret{font-size:11px;color:var(--ink2)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qwrap{position:relative}
.qmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;min-width:148px;display:grid;gap:2px;padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.qmenu[hidden]{display:none}
.qmenu.pop{animation:sheet .28s var(--spring) both;transform-origin:top right}
.qmenu button{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:0;background:transparent;border-radius:10px;text-align:left;color:var(--ink)}
.qmenu button[aria-checked="true"]{background:var(--accent-bg);color:var(--accent);font-weight:700}
.qmenu .ck{width:1em;text-align:center}
.courses{display:flex;gap:8px;overflow-x:auto;padding:4px;margin:-4px;scroll-snap-type:x proximity;scrollbar-width:none}
.courses::-webkit-scrollbar{display:none}
.cbtn{flex:none;min-width:96px;display:grid;gap:3px;justify-items:center;align-content:start;text-align:center;padding:10px 10px 11px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);box-shadow:var(--shadow-sm);scroll-snap-align:center}
.cbtn small{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.cbtn b{font-size:14px;line-height:1.3;word-break:keep-all}
.cbtn .cp{width:100%;max-width:64px;height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.cbtn .cp i{display:block;height:100%;background:var(--accent);border-radius:9px}
.cbtn{background:var(--lv1-bg);border-color:color-mix(in srgb,var(--lv1) 25%,var(--line))}
.cbtn small{color:var(--lv1-ink)}
.cbtn.on{border-color:var(--lv1);background:var(--lv1);color:var(--accent-ink);box-shadow:var(--shadow)}
.cbtn.on small{color:color-mix(in srgb,var(--accent-ink) 85%,transparent)}
.cbtn.on .cp{background:color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.cbtn.on .cp i{background:var(--accent-ink)}
.cbtn{position:relative}
.cbtn.now::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--warm);box-shadow:0 0 0 3px color-mix(in srgb,var(--warm) 22%,transparent)}
.cbtn.done small::after{content:" ✓";color:var(--good)}
.cbtn.on.done small::after{color:var(--accent-ink)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr);box-shadow:var(--shadow-sm)}
.eyebrow{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.panel h2{font-size:26px;font-weight:800}
.course-panel h2{color:var(--lv1-ink)}
.unit-panel{box-shadow:inset 5px 0 0 var(--lv2),var(--shadow-sm)}
.unit-panel .eyebrow{color:var(--lv2-ink)}
.side-label{font-size:13px;color:var(--ink2);font-weight:600}
.units{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0;list-style:none}
.utab{display:grid;grid-template-columns:30px 1fr;row-gap:6px;column-gap:10px;align-items:center;text-align:left;min-width:180px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:16px;line-height:1.35}
.utab .un{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:15px}
.utab{background:var(--lv2-bg);border-color:color-mix(in srgb,var(--lv2) 25%,var(--line))}
.utab .un{color:var(--lv2-ink)}
.utab.on{border-color:var(--lv2);background:color-mix(in srgb,var(--lv2) 18%,var(--paper));box-shadow:inset 4px 0 0 var(--lv2)}
.utab.on .un{background:var(--lv2);color:var(--paper)}
.utab.done .un{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 1.5px var(--good)}
.utab.on.done .un{background:var(--good);color:var(--paper)}
.tag-now{display:inline-block;margin-left:6px;font-style:normal;font-size:11.5px;font-weight:800;line-height:1.5;color:var(--warm);background:var(--hi-bg);border-radius:99px;padding:0 7px;vertical-align:1px;white-space:nowrap}
.mini{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.mini i,.meter i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s var(--ease)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-label{font-size:14px;color:var(--ink2);display:flex;justify-content:space-between}
.goals{margin:0;padding-left:1.1em;color:var(--ink2);font-size:16px}
.guide{background:linear-gradient(135deg,var(--accent-bg),var(--hi-bg));border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:8px;animation:sheet .5s var(--spring) both}
.guide h3{font-size:19px}
.guide ol{margin:0;padding-left:1.3em;font-size:16px;display:grid;gap:2px}
.guide .row{display:flex;justify-content:flex-end}
.continue{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--paper);border:1.5px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;width:100%}
.continue small{display:block;font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.03em}
.continue b{display:block;font-size:19px;line-height:1.35}
.continue span.go{height:44px;padding:0 18px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:var(--accent-ink);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent))}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.item{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-height:74px;box-shadow:var(--shadow-sm)}
.item .no{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);color:var(--ink2);font-size:17px}
.item.done .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.quiz .no{border-style:dashed}
.item.test .no{border-color:var(--warm);color:var(--warm)}
.item.test.done .no{background:var(--warm);color:var(--paper)}
.item b{display:block;font-size:18px;line-height:1.35}
.item small{display:block;color:var(--ink2);font-size:14px;line-height:1.4}
.item .meta{font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .meta.pass{color:var(--good);font-weight:700}
.item{position:relative;overflow:hidden}
.item .itx{min-width:0}
.item.done{background:color-mix(in srgb,var(--good-bg) 50%,var(--paper))}
.item.now{border:2px solid var(--accent);background:linear-gradient(100deg,var(--accent-bg),var(--paper) 75%);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent),var(--shadow)}
.item.now .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nowtag{display:inline-block;font-size:12px;font-weight:800;line-height:1.6;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:0 9px;margin-bottom:3px;letter-spacing:.02em}
.item .meta.go{color:var(--accent);font-weight:800}
.ibar{position:absolute;left:0;right:0;bottom:0;height:5px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.ibar i{display:block;height:100%;background:var(--accent);border-radius:0 9px 9px 0}
.continue.finished{box-shadow:none}
/* 내 공부 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{display:grid;gap:3px;justify-items:center}
.day i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--accent-ink)}
.day.on i{background:var(--accent)}
.day.today i{box-shadow:0 0 0 2px var(--paper),0 0 0 4px color-mix(in srgb,var(--accent) 55%,transparent)}
.day small{font-size:12px;color:var(--ink2);line-height:1.2}
.day.today small{color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:12px;padding:8px 6px;text-align:center;line-height:1.3}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink2)}
.wrongrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.wrongrow.has{background:var(--bad-bg)}
.wrongrow b{display:block;font-size:16px}
.wrongrow small{display:block;font-size:13px;color:var(--ink2);line-height:1.4}
.wrongrow.has small{color:var(--bad)}
.wrongrow .ghost{flex:none;height:42px;font-size:15px}
.foot{font-size:12px;color:var(--soft);margin:0}
.cheer{color:var(--warm);font-weight:700;text-align:center}
.from{font-size:13px;color:var(--ink2);margin-top:-6px}
.loading{min-height:70vh;display:grid;place-items:center;align-content:center;gap:6px;color:var(--ink2);animation:zoomIn .4s var(--ease) both}
.loading .fig{width:84px}
.home.static,.home.static .guide{animation:none}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* 알림·창 */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;line-height:1.5;box-shadow:var(--shadow);animation:sheet .3s var(--spring);transition:opacity .35s}
.toast.out{opacity:0}
dialog.sheet{border:0;padding:18px;border-radius:20px;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
dialog.sheet[open]{display:grid;gap:10px;animation:sheet .35s var(--spring)}
dialog.sheet::backdrop{background:rgba(0,0,0,.38)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h3{font-size:21px}
dialog.sheet textarea{width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--code-bg);color:var(--code-ink);resize:vertical}
dialog.sheet .msg{color:var(--accent);font-weight:700;min-height:1.2em}
.danger{border-top:1px solid var(--line);padding-top:6px}
.danger .linkbtn{color:var(--bad)}
.keyhelp{font-size:13px;color:var(--ink2);margin:0}

/* ---------- 레슨 화면 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px 12px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.top-row{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;padding:6px 10px 6px 0;font-size:16px;color:var(--accent);font-weight:600;white-space:nowrap}
.top-title{flex:1;min-width:0;font-size:15px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-title b{color:var(--ink)}
.count{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.segs{display:flex;gap:3px;margin-top:10px}
.segs button{flex:1;height:8px;padding:0;border:0;border-radius:9px;background:var(--line);transition:background .3s,transform .2s;cursor:default}
.segs button.visited{cursor:pointer}
.segs button.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.segs button.right{background:var(--good)}
.segs button.wrong{background:var(--bad)}
.segs button.cur{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.stage{padding-block:18px 170px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.stage.anim-fwd{animation:rise .5s var(--ease) both}
.stage.anim-back{animation:settle .5s var(--ease) both}
.stage.anim-zoom{animation:zoomIn .42s var(--ease) both}
.col{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm)}
.col-a{background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px)}
.kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:99px;background:var(--accent-bg);color:var(--accent)}
.pill.retry{background:var(--hi-bg);color:var(--warm)}
.pill.review{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink2)}
.how{font-size:14px;color:var(--ink2)}
.col h2{font-size:27px;font-weight:800;letter-spacing:-.01em}
.col p{margin:0}
.q-text{font-size:20px;font-weight:600;line-height:1.55}
.tip{background:var(--hi-bg);border-radius:14px;padding:12px 14px;font-size:17px}
.tip::before{content:"기억해요";display:block;font-family:var(--hand);font-weight:700;font-size:21px;color:var(--warm);line-height:1.2;margin-bottom:2px}
.fig{border-radius:12px;display:flex;justify-content:center}
.fig svg{display:block;width:100%;height:auto;max-width:480px}
.fig svg text{font-family:var(--hand)}
.fig svg text.mono{font-family:var(--mono)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.5}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--accent-bg);font-weight:700;font-size:15px;white-space:nowrap}
td:first-child{font-weight:700;white-space:nowrap}
td code{white-space:nowrap}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;font-family:var(--mono);font-size:17px;line-height:1.6;padding:8px 0;overflow-x:auto;border:1px solid var(--line)}
.ln{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:3px 14px 3px 6px;min-height:34px;align-items:center;transition:background .2s,box-shadow .2s}
.ln .nm{color:var(--soft);text-align:right;font-size:14px;user-select:none}
.ln .tx{white-space:pre-wrap;word-break:break-word}
.code.pick .ln{cursor:pointer;border-radius:10px;margin:3px 6px;min-height:48px;border:1.5px solid transparent}
.ln.sel{background:var(--paper);border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ln.right{background:var(--good-bg);border-color:var(--good)!important}
.ln.wrong{background:var(--bad-bg);border-color:var(--bad)!important;animation:shake .45s ease}
.dadd{display:inline-block;width:100%;background:var(--good-bg);color:var(--good)} .ddel{display:inline-block;width:100%;background:var(--bad-bg);color:var(--bad);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.s{color:var(--s)} .k{color:var(--k);font-weight:700} .n{color:var(--n)} .t{color:var(--t);font-weight:700} .c{color:var(--soft);font-style:italic}
.blank{display:inline-block;min-width:3.2em;text-align:center;border:2px dashed var(--warm);background:var(--hi-bg);border-radius:6px;padding:0 .3em;color:var(--ink);font-weight:700;transition:all .25s var(--spring)}
.blank.filled{border-style:solid;animation:pop .35s var(--spring)}
.out{border-radius:12px;border:1px dashed var(--soft);padding:10px 14px}
.out .lbl{font-size:13px;color:var(--ink2);font-weight:700;letter-spacing:.04em}
.out pre{margin:4px 0 0;font-family:var(--mono);font-size:16px;white-space:pre-wrap;word-break:break-word}
.out.err pre.perr,.out pre.perr{color:var(--bad)}
.out pre:empty{display:none}

/* 객관식 보기 */
.hint{font-size:14px;color:var(--ink2);margin:0}
.opts{display:grid;gap:10px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opts.multi .opt{align-items:start;padding:10px 12px;column-gap:10px}
.opts.multi .opt .ot.mono{font-size:15px;line-height:1.45}
.opts.multi .opt .radio{margin-top:2px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:12px;align-items:center;text-align:left;width:100%;min-height:60px;padding:12px 14px;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;font-size:18px;line-height:1.5;box-shadow:var(--shadow-sm)}
.opt .radio{width:30px;height:30px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink2);transition:background .2s,border-color .2s,color .2s}
.opt .ot.mono{font-family:var(--mono);white-space:pre-line;font-size:17px}
.opt .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;display:none;white-space:nowrap}
.opt .why{grid-column:2/-1;font-size:15px;line-height:1.5;margin-top:6px;color:var(--bad);display:none}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--paper));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.opt.sel .radio{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop .35s var(--spring)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:none}
.opt.right .radio{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.right .tag{display:inline-block;background:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.opt.wrong.shake{animation:shake .45s ease}
.opt.wrong .radio{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.wrong .tag{display:inline-block;background:var(--bad);color:var(--paper)}
.opt.wrong .why{display:block}
.opts.checked .opt:not(.right):not(.wrong){opacity:.45}
.opt[disabled]{cursor:default;transform:none!important}
.stack{list-style:none;margin:0;padding:10px;display:grid;gap:8px;border:2px dashed var(--soft);border-radius:14px;min-height:80px;background:var(--code-bg)}
.stack .empty{color:var(--ink2);font-size:16px;text-align:center;padding:14px 0}
.chip{overflow-wrap:anywhere;min-width:0;display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:52px;padding:9px 14px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;font-size:17px;line-height:1.45;box-shadow:var(--shadow-sm)}
.stack .chip{animation:pop .3s var(--spring)}
.chip .ix{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:14px;min-width:1.4em}
.chip.right{border-color:var(--good);background:var(--good-bg)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:grid;gap:8px}

/* 연습장 */
.editor{display:grid;gap:8px}
.editor textarea{width:100%;min-height:150px;resize:vertical;font-family:var(--mono);font-size:17px;line-height:1.6;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--code-bg);color:var(--code-ink)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:19px;box-shadow:var(--shadow-sm)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.run{height:48px;padding:0 20px;border-radius:12px;border:0;color:var(--accent-ink);font-weight:700;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(0,0,0,.15)}
.inbox{display:grid;gap:4px;font-size:15px;color:var(--ink2)}
.inbox input{height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font-size:17px;background:var(--paper);color:var(--ink)}
.preview{border:1px dashed var(--soft);border-radius:12px;padding:6px;background:var(--paper);animation:zoomIn .3s var(--ease)}
.preview .lbl{font-size:13px;color:var(--ink2);font-weight:700;letter-spacing:.02em;padding:2px 6px}
.note{font-size:14px;color:var(--ink2)}
.console{font-family:var(--mono);font-size:16px;margin-top:4px;display:grid;gap:2px;max-height:240px;overflow:auto}
.console .cl{white-space:pre-wrap;word-break:break-word;padding:1px 0;border-bottom:1px dashed var(--line)}
.console .cl.none{color:var(--soft);border:0}
.console .cl.error{color:var(--bad)} .console .cl.warn{color:var(--warm)} .console .cl.alert{color:var(--accent)}
details.peek summary{cursor:pointer;font-size:14px;color:var(--ink2)}
details.peek .code{margin-top:6px;font-size:15px}
.sum{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.sum li{counter-increment:s;display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;font-size:19px;animation:rise .5s var(--ease) both}
.sum li:nth-child(2){animation-delay:.08s} .sum li:nth-child(3){animation-delay:.16s}
.sum li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--hi);color:#1F2633;display:grid;place-items:center;font-weight:700;font-size:16px;margin-top:2px}
.score{font-family:var(--hand);font-size:64px;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums;animation:pop .5s var(--spring)}
.verdict{text-align:center;font-size:20px;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.review{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.review li{padding:10px 12px;border-radius:10px;background:var(--bad-bg);font-size:16px}

/* 아래 행동 영역: 휴대폰은 화면 아래 고정 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.dock-in{max-width:608px;margin:0 auto;display:grid;gap:10px}
.fb{border-radius:16px;padding:12px 16px;font-size:17px;line-height:1.6;animation:sheet .45s var(--spring) both;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.fb.no{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.fb h3{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.fb h3 .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--paper)}
.fb.ok h3{color:var(--good)} .fb.ok .ic{background:var(--good)}
.fb.no h3{color:var(--bad)} .fb.no .ic{background:var(--bad)}
.fb p{margin:6px 0 0}
.fbslot:empty{display:none}

@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes settle{from{opacity:0;transform:translateY(-10px) scale(1.012);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.975)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes nudge{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@media (hover:hover){
  .primary:hover:not([disabled]){filter:brightness(1.05)}
  .ghost:hover:not([disabled]){background:color-mix(in srgb,var(--paper) 92%,var(--ink))}
  .cbtn:hover:not(.on){border-color:var(--soft)}
  .utab:hover:not(.on){border-color:var(--soft)}
  .continue:hover{transform:translateY(-1px)}
  .item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px);box-shadow:var(--shadow)}
  .segs button.visited:hover{transform:scaleY(1.6)}
  .code.pick .ln:hover{background:var(--paper);border-color:var(--line)}
  .opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px);box-shadow:var(--shadow)}
  .chip:hover:not([disabled]){border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- 단축키 글쇠(설정에 따라 ⌘ 또는 Ctrl) ---------- */
.combo{display:inline-flex;align-items:center;gap:2px;vertical-align:1px;white-space:nowrap}
.combo .kc{font-family:var(--body);font-size:.8em;font-weight:800;min-width:1.75em;text-align:center;padding:.02em .38em;border:1px solid color-mix(in srgb,var(--ink) 18%,var(--line));border-bottom-width:2.5px;border-radius:6px;background:var(--paper);color:var(--ink);line-height:1.5}
.combo .plus{font-size:.7em;color:var(--ink2)}
.qbtn .ga.os{font-size:15px}
/* 미션·이미 알아요 */
.item.mission .no{border-color:var(--hi);color:var(--warm);background:var(--hi-bg)}
.item.mission.done .no{background:var(--warm);border-color:var(--warm);color:var(--paper)}
.skiprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--hi-bg)}
.skiprow b{display:block;font-size:15px}
.skiprow small{display:block;font-size:13px;color:var(--ink2);line-height:1.4}
.skiprow .ghost{height:42px;font-size:15px}
.skiprow .checked{grid-column:1/-1}
.checked{display:block;font-size:12.5px;color:var(--ink2)}
.ghost.sm{height:36px;padding:0 12px;font-size:14px}
.mmeter{display:grid;gap:4px;font-size:14px;color:var(--ink2)}
.mtasks{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.mtask{min-width:0;grid-template-columns:minmax(0,1fr);overflow-wrap:anywhere;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;background:var(--paper);transition:background .2s,border-color .2s}
.mhead{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:17px;font-weight:700;line-height:1.5;cursor:pointer}
.mhead input{position:absolute;opacity:0;width:1px;height:1px}
.mbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--soft);display:grid;place-items:center;margin-top:1px;transition:background .2s,border-color .2s}
.mhead input:checked + .mbox{background:var(--good);border-color:var(--good);animation:pop .35s var(--spring)}
.mhead input:checked + .mbox::after{content:"✓";color:var(--paper);font-weight:900;font-size:15px}
.mhead input:focus-visible + .mbox{box-shadow:var(--ring)}
.mtask:has(input:checked){background:color-mix(in srgb,var(--good-bg) 60%,var(--paper));border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.mhow,.mcheck{margin:0 0 0 38px;font-size:15px;line-height:1.55;color:var(--ink2)}
.mcheck b{color:var(--good)}
.mprompt{margin-left:38px;display:grid;gap:6px;justify-items:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.mprompt pre{margin:0;width:100%;white-space:pre-wrap;font-family:var(--body);font-size:14px;line-height:1.5;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.inbox textarea{width:100%;font:inherit;font-size:15px;line-height:1.5;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}

/* ---------- 모의 화면: 할 일 목록·안내 ---------- */
.sgoals{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sgoals li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;font-size:16px;line-height:1.5;color:var(--ink2)}
.sgoals .gi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:2px solid var(--line)}
.sgoals li.now{color:var(--ink);font-weight:700}
.sgoals li.now .gi{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sgoals li.ok .gi{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.sgoal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-radius:14px;background:var(--accent-bg);font-size:16px;line-height:1.45}
.sgoal>b{flex:1 1 11em}
.sstep{font-size:12px;font-weight:800;color:var(--accent);background:var(--paper);border-radius:99px;padding:1px 8px}
.sdone{flex:1;color:var(--good);font-weight:800}
.keybtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--accent);background:var(--paper);font-size:15px;font-weight:700;color:var(--accent);box-shadow:var(--shadow-sm)}
.keybtn .combo{font-size:18px}
.ssay{font-size:16px;line-height:1.55;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
.ssay:empty{display:none}
.ssay.ok{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.ssay.no{background:var(--hi-bg);border-color:color-mix(in srgb,var(--warm) 35%,transparent)}
.ssay.pop{animation:sheet .35s var(--spring) both}
.snote{font-size:12px;color:var(--soft);margin:4px 2px 0;line-height:1.4}
.simhold{display:grid}
.glow{animation:glow 1.1s ease 3;border-radius:6px}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,0)}50%{box-shadow:0 0 0 3px #ffc400,0 0 14px 2px rgba(255,196,0,.6)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- 모의 Cursor 창(늘 어두운 테마) ---------- */
.sim{--s-bg:#181818;--s-bg2:#1f1f1f;--s-bg3:#2c2c2c;--s-line:#313131;--s-ink:#d8d8d8;--s-ink2:#909090;--s-acc:#4da3ff;--s-good:#3fb950;--s-bad:#f85149;--s-sel:#2f3a4a;
  container-type:inline-size;position:relative;display:flex;flex-direction:column;height:370px;border-radius:12px;overflow:hidden;background:var(--s-bg);color:var(--s-ink);
  font:12.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-stroke:0;word-break:normal;
  box-shadow:0 1px 2px rgba(0,0,0,.2),0 12px 30px rgba(0,0,0,.18);border:1px solid #000;user-select:none;-webkit-user-select:none}
.s-bar{flex:none;height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--s-bg2);border-bottom:1px solid var(--s-line);color:var(--s-ink2);font-size:11.5px}
.s-bar i{flex:none;width:10px;height:10px;border-radius:50%;background:#ff5f57}
.s-bar i:nth-child(2){background:#febc2e} .s-bar i:nth-child(3){background:#28c840}
.s-bar span{flex:1;text-align:center;margin-right:36px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-body{flex:1;min-height:0;display:grid}
.st{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;transition:background .15s}
.st:focus-visible{outline:2px solid var(--s-acc);outline-offset:1px;box-shadow:none!important}
.sim .sp{flex:1}
.s-row{display:flex;align-items:center;gap:6px}
.s-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--s-ink2);padding:8px 10px 4px}
.s-muted{color:var(--s-ink2);padding:8px 10px;margin:0}
/* Agents Window */
.s-body.agents{grid-template-columns:30% minmax(0,1fr)}
.s-body.agents.has-changes{grid-template-columns:26% minmax(0,1fr) 27%}
.s-side{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--s-bg2);border-right:1px solid var(--s-line);min-width:0}
.s-new{padding:6px 8px;border-radius:6px;background:var(--s-bg3);font-weight:600;margin-bottom:6px}
.s-list{display:grid;gap:2px}
.s-agent{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-agent.on{background:var(--s-sel)}
.s-agent .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--s-ink2)}
.s-agent .dot.run{background:var(--s-acc)} .s-agent .dot.done{background:var(--s-good)}
.s-sbtn{padding:5px 8px;border-radius:6px;color:var(--s-ink2)}
.s-chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.s-chat.empty{display:grid;place-items:center;color:var(--s-ink2)}
.s-chat.empty p{margin:0}
.s-msgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
.s-mewrap{align-self:flex-end;max-width:85%;display:grid;justify-items:end;gap:3px}
.s-me{background:var(--s-bg3);border-radius:10px;padding:6px 10px}
.s-ai{max-width:96%;display:grid;gap:6px;justify-items:start}
.s-link{color:var(--s-acc);font-size:11.5px}
.sim code{background:var(--s-bg3);color:#e8e8e8;border-color:#3d3d3d;font-size:.92em}
.sim .s-page-w code{background:#eee;color:#222;border-color:#ddd}
.s-run{border:1px solid var(--s-line);border-radius:8px;padding:6px 8px;display:grid;gap:6px;background:var(--s-bg2);justify-self:stretch}
.s-run code{font:11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--s-ink);background:none;border:0;padding:0}
.s-run .s-row{justify-content:flex-end}
.s-btn{padding:3px 10px;border-radius:6px;border:1px solid #444;background:var(--s-bg3);font-size:11.5px;font-weight:600;white-space:nowrap}
.s-btn.pri{background:var(--s-acc);border-color:var(--s-acc);color:#fff}
.s-input{margin:0 8px 8px;border:1px solid var(--s-line);border-radius:10px;background:var(--s-bg2);padding:6px 8px;display:grid;gap:6px}
.s-chip{padding:1px 8px;border-radius:99px;background:var(--s-bg3);font-size:11px;color:var(--s-ink2);white-space:nowrap}
.s-send{flex:none;width:22px;height:22px;border-radius:50%;background:var(--s-ink);color:var(--s-bg);display:grid;place-items:center;font-weight:800;text-align:center;line-height:1}
.sfield{min-height:22px;cursor:text;display:flex;align-items:center;gap:1px;white-space:pre-wrap;min-width:0}
.sfield .ph{color:#6b6b6b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfield .caret{flex:none;width:1.5px;height:14px;background:var(--s-ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.s-changes{border-left:1px solid var(--s-line);background:var(--s-bg2);display:flex;flex-direction:column;gap:2px;padding-bottom:6px;min-width:0}
.s-file{display:flex;justify-content:space-between;gap:6px;padding:4px 10px;white-space:nowrap}
.s-file span{overflow:hidden;text-overflow:ellipsis}
.s-file small{font-size:11px} .s-file .add{color:var(--s-good)} .s-file .del{color:var(--s-bad)}
/* IDE 창 */
.s-body.ide{grid-template-columns:34px 25% minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.s-body.ide.has-panel{grid-template-columns:34px 20% minmax(0,1fr) 35%}
.s-body.ide.has-term{grid-template-rows:minmax(0,1fr) auto}
.s-act{grid-row:1/-1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;background:var(--s-bg2);border-right:1px solid var(--s-line)}
.s-ico{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--s-ink2);font-size:15px;text-align:center;line-height:1}
.s-ico.on{color:var(--s-ink);box-shadow:inset 2px 0 0 var(--s-acc)}
.s-tree{grid-row:1/-1;background:var(--s-bg2);border-right:1px solid var(--s-line);min-width:0;overflow:hidden}
.s-f{display:block;width:100%;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-f.on{background:var(--s-sel)} .s-f.dir{color:var(--s-ink2)}
.s-ed{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--s-bg)}
.s-tabs{flex:none;display:flex;background:var(--s-bg2);border-bottom:1px solid var(--s-line)}
.s-tab{padding:5px 12px;background:var(--s-bg);border-right:1px solid var(--s-line);box-shadow:inset 0 1px 0 var(--s-acc)}
.s-empty{flex:1;display:grid;place-items:center;color:var(--s-ink2)}
.s-code{flex:1;min-height:0;overflow:auto;padding:6px 0;font:12px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,"D2Coding",monospace}
.s-ln{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding-right:8px}
.s-ln .nm{color:#5a5a5a;text-align:right}
.s-ln .tx{white-space:pre-wrap;word-break:break-word}
.sim .tx .k,.sim .s-tl .k{color:#c586c0;font-weight:400} .sim .tx .s,.sim .s-tl .s{color:#ce9178} .sim .tx .n,.sim .s-tl .n{color:#b5cea8} .sim .tx .t{color:#4ec9b0;font-weight:400} .sim .tx .c,.sim .s-tl .c{color:#6a9955}
.s-ghost{color:#6f6f6f;font-style:italic}
.s-ln.del{background:rgba(248,81,73,.16)} .s-ln.del .tx{text-decoration:line-through;text-decoration-color:rgba(248,81,73,.55)} .s-ln.del .nm{color:var(--s-bad)}
.s-ln.add{background:rgba(63,185,80,.16)} .s-ln.add .nm{color:var(--s-good)}
.s-diff{position:relative;margin:2px 0}
.s-dbtn{position:absolute;right:8px;top:-3px;z-index:1}
.s-inline{margin:2px 8px 4px 38px;border:1px solid var(--s-acc);border-radius:8px;background:var(--s-bg2);padding:5px 8px;font:12.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif}
.s-body.ide.has-panel .s-chat{border-left:1px solid var(--s-line);background:var(--s-bg2)}
.s-body.ide.has-panel .s-input{background:var(--s-bg)}
.s-term{grid-column:2/-1;border-top:1px solid var(--s-line);background:var(--s-bg);max-height:96px;overflow:auto;padding-bottom:6px}
.s-tl{font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:0 10px;white-space:pre-wrap}
/* 덮개: 팔레트·메뉴·설정 창·알림 */
.s-over{position:absolute;inset:28px 0 0;background:rgba(0,0,0,.45);display:grid;place-items:start center;padding-top:10px;animation:fadeIn .15s both}
.s-over.light{background:rgba(0,0,0,.18)}
.s-pal{width:min(80%,420px);background:#252526;border:1px solid #454545;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden;animation:sheet .2s var(--ease) both}
.s-pal .sfield{padding:8px 10px;border-bottom:1px solid #3a3a3a;font-size:13px}
.s-pl{display:grid;padding:4px}
.s-pi{padding:5px 10px;border-radius:6px}
.s-pi:first-child{background:#04395e}
.s-menu{position:absolute;left:12px;bottom:52px;min-width:150px;background:#252526;border:1px solid #454545;border-radius:8px;padding:4px;display:grid;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:sheet .2s var(--ease) both}
.s-mi{padding:5px 10px;border-radius:5px}
.s-dlg{width:92%;height:calc(100% - 20px);background:var(--s-bg2);border:1px solid #454545;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:sheet .22s var(--ease) both}
.s-dlgbar{flex:none;display:flex;align-items:center;padding:7px 10px 7px 12px;border-bottom:1px solid var(--s-line)}
.s-x{width:24px;height:24px;border-radius:6px;text-align:center;color:var(--s-ink2)}
.s-dlgin{flex:1;min-height:0;display:grid;grid-template-columns:30% minmax(0,1fr)}
.s-nav{display:grid;align-content:start;gap:2px;padding:6px;border-right:1px solid var(--s-line)}
.s-navi{padding:5px 8px;border-radius:6px;color:var(--s-ink2)}
.s-navi.on{background:var(--s-bg3);color:var(--s-ink)}
.s-page{padding:10px 14px;overflow:auto;display:grid;align-content:start;gap:8px}
.s-h1{font-size:15px;font-weight:700}
.s-h2{font-size:12.5px;font-weight:700;color:var(--s-ink2)}
.s-setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--s-line)}
.s-setrow b{font-weight:600}
.s-setrow small{display:block;color:var(--s-ink2);font-size:11px;line-height:1.4}
.s-tog{flex:none;width:34px;height:20px;border-radius:99px;background:#4a4a4a;position:relative;transition:background .2s}
.s-tog i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.s-tog.on{background:var(--s-acc)} .s-tog.on i{transform:translateX(14px)}
.s-rule{padding:6px 8px;border:1px solid var(--s-line);border-radius:6px;background:var(--s-bg)}
.s-rulein{display:grid;gap:6px}
.sfield.area{min-height:52px;align-items:flex-start;padding:6px 8px;border:1px solid var(--s-acc);border-radius:6px;background:var(--s-bg)}
.s-page>.s-btn{justify-self:start}
.s-toast{position:absolute;right:12px;bottom:12px;max-width:70%;background:#2d2d2d;border:1px solid #454545;border-radius:8px;padding:6px 10px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:sheet .25s var(--spring) both}
.s-row.wrap{flex-wrap:wrap}
.s-chgbtns{padding:6px 10px 0}
.s-body.agents.has-web{grid-template-columns:24% minmax(0,1fr) 40%}
.s-web{border-left:1px solid var(--s-line);background:var(--s-bg2);display:flex;flex-direction:column;min-width:0;min-height:0}
.s-url{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--s-line);color:var(--s-ink2);font-size:11px}
.s-url code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px/1.4 ui-monospace,Menlo,monospace;background:var(--s-bg);border:1px solid var(--s-line);border-radius:6px;padding:2px 8px;color:var(--s-ink)}
.s-page-w{flex:1;min-height:0;overflow:auto;margin:8px;border-radius:6px;background:#fafafa;color:#222;padding:8px 10px;font-size:12px;line-height:1.5}
.s-page-w h1,.s-page-w h2,.s-page-w h3{font-size:14px;margin:0 0 4px}
.s-page-w p{margin:0 0 4px}
.s-weblinks{padding:0 8px 8px}
.s-cons{border-top:1px solid var(--s-line);max-height:84px;overflow:auto;padding-bottom:4px}
.s-tl.err{color:var(--s-bad)}
.s-body.termwin{display:flex}
.s-term.full{flex:1;max-height:none;border-top:0;padding-top:8px}
.s-prompt{display:flex;align-items:center;gap:2px}
.s-prompt .sfield{min-height:18px}
@media (hover:hover){ .sim .st:hover{background-color:rgba(255,255,255,.07)} .sim .s-btn.pri:hover,.sim .s-send:hover{filter:brightness(1.1)} }
/* ---------- 모의 웹 창(업스테이지 콘솔·내 웹앱): 밝은 테마 ---------- */
.sim.w-web{--s-bg:#ffffff;--s-bg2:#f6f6f8;--s-bg3:#ececf1;--s-line:#e2e2e8;--s-ink:#1d1d22;--s-ink2:#6b6b76;--s-acc:#6b4fd8;--s-good:#1f8a4c;--s-bad:#d0453a;--s-sel:#ece7ff;
  border-color:#d5d5dc;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 30px rgba(0,0,0,.12)}
.w-web .s-bar{background:#ececf0;color:#55555f}
.w-url{background:#f3f3f6}
.w-url code{background:#fff!important;color:#333!important}
.w-web .sfield .ph{color:#9a9aa5}
.w-web .sfield .caret{background:#333}
.w-web code{background:#f1f1f5;color:#2a2a33;border-color:#e0e0e6}
.s-body.web{grid-template-columns:minmax(0,1fr);overflow:hidden}
.s-body.web.has-nav{grid-template-columns:22% minmax(0,1fr)}
.s-body.web.has-aside{grid-template-columns:minmax(0,1fr) 34%}
.s-body.web.has-nav.has-aside{grid-template-columns:19% minmax(0,1fr) 30%}
.w-nav{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--s-bg2);border-right:1px solid var(--s-line);min-width:0;overflow:auto}
.w-brand{font-weight:800;font-size:12.5px;padding:2px 8px 8px;color:var(--s-acc);letter-spacing:-.01em}
.w-navi{padding:5px 8px;border-radius:6px;color:var(--s-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-navi.sub{padding-left:18px;font-size:11.5px}
.w-navi.on{background:var(--s-sel);color:var(--s-acc);font-weight:700}
.w-main,.w-aside{min-width:0;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.w-aside{background:var(--s-bg2);border-left:1px solid var(--s-line)}
.w-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- 위 메뉴 탭 ---------- */

.gsearch{display:grid;gap:10px}
